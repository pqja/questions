<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- منع التكبير والتصغير ليعمل كتطبيق حقيقي -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة درب التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --bg-color: #F3F4F6;
            --text-main: #1F2937;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* منع النسخ واللصق والتحديد */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* iOS Safari */
            overscroll-behavior-y: none; /* منع السحب للتحديث */
        }

        /* منع تكبير الخطوط التلقائي في الايفون */
        input, textarea, select {
            font-size: 16px !important;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .animated-bg {
            background: linear-gradient(-45deg, #4F46E5, #3B82F6, #10B981, #6366F1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bottom-nav {
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        }

        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-item.active .nav-icon {
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }

        /* تنسيق مشغل الفيديو */
        video {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            background: #000;
        }

        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* رسائل الخطأ والنجاح */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }

        /* رسائل المحادثة */
        .chat-msg-user {
            background: var(--primary);
            color: white;
            border-radius: 16px 16px 0 16px;
        }
        .chat-msg-bot {
            background: white;
            color: var(--text-main);
            border-radius: 16px 16px 16px 0;
            border: 1px solid #e5e7eb;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    
    <!-- نظام الإشعارات (Toast) -->
    <div id="toast" class="toast px-6 py-3 rounded-full text-white font-semibold shadow-lg"></div>

    <!-- نافذة منبثقة (Modal) -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modalContent" class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <!-- سيتم حقن محتوى المودال هنا -->
        </div>
    </div>

    <!-- 1. شاشة تسجيل الدخول / إنشاء حساب -->
    <div id="authScreen" class="absolute inset-0 z-40 animated-bg flex items-center justify-center p-4 overflow-y-auto">
        <div class="glass-card w-full max-w-sm rounded-3xl p-8 relative">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto shadow-lg mb-4">
                    <i class="fas fa-graduation-cap text-4xl text-indigo-600"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">منصة درب</h1>
                <p class="text-white/80 text-sm">طريقك نحو التفوق والنجاح</p>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition" required>
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="الرمز السري" class="w-full bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition" required>
                </div>
                <button type="submit" class="w-full bg-white text-indigo-600 font-bold rounded-xl py-3 shadow-lg hover:shadow-xl transition transform active:scale-95">تسجيل الدخول</button>
                <p class="text-center text-white/90 text-sm mt-4 cursor-pointer hover:underline" onclick="toggleAuth('signup')">لا تملك حساب؟ أنشئ حساب الآن</p>
            </form>

            <!-- نموذج إنشاء حساب -->
            <form id="signupForm" class="space-y-4 hidden">
                <div>
                    <input type="text" id="signupName" placeholder="الاسم الثلاثي" class="w-full bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition" required>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-white/70" dir="ltr">+964</span>
                    <input type="tel" id="signupPhone" placeholder="07XXXXXXXXX" pattern="07[0-9]{9}" title="يجب أن يبدأ ب 07 ويتكون من 11 رقم" class="w-full bg-white/20 border border-white/30 rounded-xl pl-16 pr-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition text-right" required>
                </div>
                <div>
                    <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" class="w-full bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition" required>
                </div>
                <div>
                    <input type="password" id="signupPassword" placeholder="رمز الحساب" class="w-full bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white transition" required>
                </div>
                <button type="submit" class="w-full bg-white text-indigo-600 font-bold rounded-xl py-3 shadow-lg hover:shadow-xl transition transform active:scale-95">إنشاء الحساب</button>
                <p class="text-center text-white/90 text-sm mt-4 cursor-pointer hover:underline" onclick="toggleAuth('login')">لديك حساب؟ سجل دخولك</p>
            </form>
        </div>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية (مخفية حتى يتم تسجيل الدخول) -->
    <div id="mainApp" class="hidden flex-1 h-full flex flex-col relative pb-[70px]">
        
        <!-- Header -->
        <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center z-10 rounded-b-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 shadow-inner">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-lg leading-tight" id="headerTitle">المحاضرات</h2>
                    <p class="text-xs text-gray-500" id="headerSub">منصة درب</p>
                </div>
            </div>
            <button id="backBtn" class="hidden w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-600 active:bg-gray-200 transition" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="contentArea" class="flex-1 overflow-y-auto p-4 scroll-smooth">
            <!-- سيتم حقن المحتوى هنا بناءً على القسم -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav bg-white fixed bottom-0 w-full h-[70px] rounded-t-3xl flex justify-around items-center px-2 z-20">
            <button class="nav-item active flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('lectures', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-play-circle"></i></div>
                <span class="text-[10px] font-bold">المحاضرات</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full relative" onclick="switchTab('ai', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-robot"></i></div>
                <span class="text-[10px] font-bold">المساعد الذكي</span>
                <span class="absolute top-2 right-4 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('profile', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-user"></i></div>
                <span class="text-[10px] font-bold">حسابي</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Firebase Configuration (From User)
        const firebaseConfig = {
            apiKey: "AIzaSyB_VdrKx54tADWsmRDz1QSNn_bHnrbFI88",
            authDomain: "darb-56124.firebaseapp.com",
            projectId: "darb-56124",
            storageBucket: "darb-56124.firebasestorage.app",
            messagingSenderId: "705925344755",
            appId: "1:705925344755:web:e00882d29cf122d5c8f686",
            measurementId: "G-5G66M3LYJ6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'darb-56124'; // المعرف الثابت لاستخدامه في المسارات
        const ADMIN_EMAIL = "mslmalmyaly223@gmail.com";

        // App State
        let currentUser = null;
        let userData = null;
        let currentTab = 'lectures';
        
        // Navigation Stack for Lectures
        let navStack = []; 
        /* 
         Level 0: Grade Selection (السادس العلمي / الثالث متوسط)
         Level 1: Subjects
         Level 2: Teachers
         Level 3: Chapters
         Level 4: Lectures List
         Level 5: Video Player
        */

        // Data Cache
        let dbData = {
            subjects: [],
            teachers: [],
            chapters: [],
            lectures: [],
            mySubscriptions: []
        };

        // DOM Elements
        const DOM = {
            authScreen: document.getElementById('authScreen'),
            mainApp: document.getElementById('mainApp'),
            loginForm: document.getElementById('loginForm'),
            signupForm: document.getElementById('signupForm'),
            contentArea: document.getElementById('contentArea'),
            headerTitle: document.getElementById('headerTitle'),
            headerSub: document.getElementById('headerSub'),
            backBtn: document.getElementById('backBtn'),
            toast: document.getElementById('toast'),
            modalOverlay: document.getElementById('modalOverlay'),
            modalContent: document.getElementById('modalContent')
        };

        
        window.showToast = (msg, type = 'success') => {
            DOM.toast.textContent = msg;
            DOM.toast.className = `toast show px-6 py-3 rounded-full text-white font-semibold shadow-lg ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            setTimeout(() => {
                DOM.toast.classList.remove('show');
            }, 3000);
        };

        window.toggleAuth = (type) => {
            if(type === 'signup') {
                DOM.loginForm.classList.add('hidden');
                DOM.signupForm.classList.remove('hidden');
            } else {
                DOM.signupForm.classList.add('hidden');
                DOM.loginForm.classList.remove('hidden');
            }
        };

        window.showModal = (htmlContent) => {
            DOM.modalContent.innerHTML = htmlContent;
            DOM.modalOverlay.classList.remove('hidden');
            setTimeout(() => DOM.modalContent.classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            DOM.modalContent.classList.add('scale-95');
            setTimeout(() => {
                DOM.modalOverlay.classList.add('hidden');
                DOM.modalContent.innerHTML = '';
            }, 300);
        };


        DOM.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<div class="loader mx-auto border-indigo-600 border-t-white"></div>';
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // Auth state listener will handle UI change
            } catch (error) {
                showToast('خطأ في تسجيل الدخول: ' + error.message, 'error');
                btn.innerHTML = 'تسجيل الدخول';
            }
        });

        DOM.signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            
            // Validate Phone (Must be 11 digits starting with 07)
            if(!/^07[0-9]{9}$/.test(phone)) {
                showToast('رقم الهاتف يجب أن يتكون من 11 رقم ويبدأ ب 07', 'error');
                return;
            }
            // Validate Name (At least 3 words)
            if(name.trim().split(/\s+/).length < 3) {
                showToast('يرجى كتابة الاسم الثلاثي كاملاً', 'error');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.innerHTML = '<div class="loader mx-auto border-indigo-600 border-t-white"></div>';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                
                // Save additional user info strictly following RULES
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data'), {
                    name: name,
                    phone: phone,
                    grade: '', // لم يتم اختياره بعد
                    gender: Math.random() > 0.5 ? 'boy' : 'girl' // تعيين عشوائي لعدم وجود حقل الجنس
                });
                
            } catch (error) {
                showToast('خطأ في إنشاء الحساب: ' + error.message, 'error');
                btn.innerHTML = 'إنشاء الحساب';
            }
        });

        
        async function fetchInitialData() {
            if (!currentUser) return;
            
            DOM.contentArea.innerHTML = '<div class="flex h-full items-center justify-center"><div class="loader"></div></div>';
            
            try {
                // Fetch User Profile
                const profileDoc = await getDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data'));
                if (profileDoc.exists()) {
                    userData = profileDoc.data();
                } else {
                    userData = { name: 'طالب', grade: '', gender: 'boy' };
                }

                // Fetch Subscriptions
                const subsSnapshot = await getDocs(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'subscriptions'));
                dbData.mySubscriptions = subsSnapshot.docs.map(d => d.id); // teacher IDs

                // Fetch Public Data (Subjects, Teachers, Chapters, Lectures)
                // RULE: Simple queries, fetch all and filter in memory.
                const colls = ['subjects', 'teachers', 'chapters', 'lectures'];
                for(let col of colls) {
                    const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', col));
                    dbData[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                }

                renderCurrentTab();
            } catch(e) {
                console.error("Data fetch error:", e);
                showToast("حدث خطأ في جلب البيانات", "error");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                DOM.authScreen.classList.add('hidden');
                DOM.mainApp.classList.remove('hidden');
                fetchInitialData();
            } else {
                currentUser = null;
                userData = null;
                DOM.mainApp.classList.add('hidden');
                DOM.authScreen.classList.remove('hidden');
            }
        });


        window.switchTab = (tabName, btnElement) => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            currentTab = tabName;
            navStack = []; // Reset lecture navigation
            renderCurrentTab();
        };

        window.goBack = () => {
            if(navStack.length > 0) {
                navStack.pop();
                renderLecturesFlow();
            }
        };

        function updateHeader(title, sub, showBack = false) {
            DOM.headerTitle.textContent = title;
            DOM.headerSub.textContent = sub;
            DOM.backBtn.style.display = showBack ? 'flex' : 'none';
        }

        function renderCurrentTab() {
            DOM.contentArea.innerHTML = '';
            DOM.backBtn.classList.add('hidden'); // default hidden

            if (currentTab === 'lectures') {
                renderLecturesFlow();
            } else if (currentTab === 'ai') {
                renderAI();
            } else if (currentTab === 'profile') {
                renderProfile();
            }
        }


        function renderLecturesFlow() {
            const level = navStack.length;
            DOM.contentArea.innerHTML = '';
            
            if (level === 0) {
                // المستوى 0: اختيار المرحلة
                updateHeader('المراحل الدراسية', 'اختر مرحلتك', false);
                
                const grades = ['السادس العلمي', 'الثالث متوسط'];
                const html = `
                    <div class="space-y-4 mt-4">
                        ${grades.map(grade => `
                            <div onclick="pushNav({type: 'grade', name: '${grade}'})" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-95 transition cursor-pointer">
                                <div>
                                    <h3 class="font-bold text-xl text-gray-800">${grade}</h3>
                                    <p class="text-sm text-gray-500 mt-1">عرض المواد الخاصة بهذه المرحلة</p>
                                </div>
                                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">
                                    <i class="fas fa-chevron-left"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                DOM.contentArea.innerHTML = html;

            } else if (level === 1) {
                // المستوى 1: المواد
                const currentGrade = navStack[0].name;
                updateHeader('المواد الدراسية', currentGrade, true);
                
                const subjects = dbData.subjects.filter(s => s.grade === currentGrade);
                if(subjects.length === 0) {
                    DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-folder-open text-4xl mb-4"></i><p>لا توجد مواد مضافة حالياً</p></div>';
                    return;
                }

                const html = `
                    <div class="grid grid-cols-2 gap-4 mt-2">
                        ${subjects.map(sub => `
                            <div onclick="pushNav({type: 'subject', id: '${sub.id}', name: '${sub.name}'})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center active:scale-95 transition cursor-pointer h-32 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-indigo-50 rounded-bl-full -z-0"></div>
                                <i class="fas fa-book text-3xl text-indigo-500 mb-3 z-10"></i>
                                <h3 class="font-bold text-gray-800 z-10">${sub.name}</h3>
                            </div>
                        `).join('')}
                    </div>
                `;
                DOM.contentArea.innerHTML = html;

            } else if (level === 2) {
                // المستوى 2: المدرسين
                const currentGrade = navStack[0].name;
                const currentSubject = navStack[1];
                updateHeader('المدرسين', currentSubject.name, true);

                const teachers = dbData.teachers.filter(t => t.grade === currentGrade && t.subject === currentSubject.id);
                if(teachers.length === 0) {
                    DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-users text-4xl mb-4"></i><p>لا يوجد مدرسين مضافين لهذه المادة</p></div>';
                    return;
                }

                const html = `
                    <div class="space-y-3 mt-2">
                        ${teachers.map(teacher => `
                            <div onclick="pushNav({type: 'teacher', id: '${teacher.id}', name: '${teacher.name}'})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 active:scale-95 transition cursor-pointer">
                                <div class="w-14 h-14 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
                                    <i class="fas fa-chalkboard-teacher"></i>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-gray-800 text-lg">${teacher.name}</h3>
                                    <p class="text-xs text-green-600 mt-1"><i class="fas fa-check-circle"></i> متاح الآن</p>
                                </div>
                                <i class="fas fa-chevron-left text-gray-300"></i>
                            </div>
                        `).join('')}
                    </div>
                `;
                DOM.contentArea.innerHTML = html;

            } else if (level === 3) {
                // المستوى 3: الفصول
                const currentTeacher = navStack[2];
                updateHeader('الفصول', currentTeacher.name, true);

                const chapters = dbData.chapters.filter(c => c.teacher === currentTeacher.id);
                if(chapters.length === 0) {
                    DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-layer-group text-4xl mb-4"></i><p>لا توجد فصول مضافة</p></div>';
                    return;
                }

                const html = `
                    <div class="space-y-3 mt-2">
                        ${chapters.map((chap, idx) => `
                            <div onclick="pushNav({type: 'chapter', id: '${chap.id}', name: '${chap.name}'})" class="bg-white p-5 rounded-2xl shadow-sm border-r-4 border-indigo-500 flex items-center justify-between active:scale-95 transition cursor-pointer">
                                <div class="flex items-center gap-4">

        window.verifyCode = async (teacherId) => {
            const input = document.getElementById('code-input').value.trim();
            if(!input) {
                showToast("الرجاء إدخال الكود", "error");
                return;
            }

            // Client-side verification (Not super secure, but works within constraints without Cloud Functions)
            // Fetch the specific code document
            try {
                const codeDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', input);
                const codeDoc = await getDoc(codeDocRef);

                if(!codeDoc.exists()) {
                    showToast("الكود غير صحيح", "error");
                    return;
                }

                const codeData = codeDoc.data();

                if(codeData.used) {
                    showToast("هذا الكود مستخدم مسبقاً", "error");
                    return;
                }

                if(codeData.teacher !== teacherId) {
                    showToast("هذا الكود لا يخص هذا الأستاذ", "error");
                    return;
                }

                // Mark code as used
                await updateDoc(codeDocRef, {
                    used: true,
                    usedBy: currentUser.uid,
                    usedAt: new Date().toISOString()
                });

                // Add to user's subscriptions
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'subscriptions', teacherId), {
                    active: true,
                    addedAt: new Date().toISOString()
                });

                showToast("تم تفعيل الكود بنجاح!");

                // Re-render
                renderLecturesFlow();

            chatBox.innerHTML += `

            chatBox.scrollTop = chatBox.scrollHeight;

            // استدعاء API Gemini وفقاً لتعليمات النظام
            try {
                const systemPrompt = "أنت مدرس عراقي خبير وتعمل كمساعد في 'منصة درب'. تخصصك فقط في مناهج العراق للصف السادس العلمي والثالث متوسط. جاوب بأسلوب مبسط، مشجع، ولهجة عراقية خفيفة مفهومة. ممنوع الإجابة على أي سؤال خارج المنهج أو خارج العراق.";
                
                const payload = {
                    contents: [{ parts: [{ text: msg }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };
                
                // استخدام المفتاح الفارغ كما طلب النظام
                const apiKey = "";

                const result = await response.json();
                document.getElementById(loadingId).remove();

                if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {

                                ${dbData.subjects.map(s => `<option value="${s.id}">${s.grade} - ${s.name}</option>`).join('')}
                            </select>
                            <input type="text" id="admin-teacher-name" placeholder="اسم الأستاذ" class="w-full mb-3 bg-gray-50 border rounded-lg p-2 text-sm focus:outline-none">
                            <button onclick="adminAddTeacher()" class="w-full bg-indigo-100 text-indigo-700 font-bold py-2 rounded-lg text-sm active:bg-indigo-200">حفظ الأستاذ</button>
                        </div>

                        <!-- إضافة فصل -->
                        <div class="bg-white p-4 rounded-xl shadow-sm">
                            <h3 class="font-bold text-gray-800 mb-3 border-b pb-2"><i class="fas fa-layer-group ml-2 text-indigo-500"></i> إضافة فصل</h3>
                            <select id="admin-chap-teacher" class="w-full mb-2 bg-gray-50 border rounded-lg p-2 text-sm">
                                ${dbData.teachers.map(t => `<option value="${t.id}">${t.name} (${t.grade})</option>`).join('')}
                            </select>
                            <input type="text" id="admin-chap-name" placeholder="اسم الفصل (مثال: الفصل الأول)" class="w-full mb-3 bg-gray-50 border rounded-lg p-2 text-sm focus:outline-none">
                            <button onclick="adminAddChapter()" class="w-full bg-indigo-100 text-indigo-700 font-bold py-2 rounded-lg text-sm active:bg-indigo-200">حفظ الفصل</button>
                        </div>

                        <!-- إضافة محاضرة -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-green-200 shadow-green-100">
                            <h3 class="font-bold text-gray-800 mb-3 border-b pb-2"><i class="fas fa-video ml-2 text-green-500"></i> إضافة محاضرة (تلكرام)</h3>
                            <select id="admin-lec-chapter" class="w-full mb-2 bg-gray-50 border rounded-lg p-2 text-sm">
                                ${dbData.chapters.map(c => {
                                    const t = dbData.teachers.find(x => x.id === c.teacher);
                                    return `<option value="${c.id}">${c.name} - ${t?.name || ''}</option>`;
                                }).join('')}
                            </select>
                            <input type="text" id="admin-lec-name" placeholder="اسم المحاضرة" class="w-full mb-2 bg-gray-50 border rounded-lg p-2 text-sm focus:outline-none">
                            <input type="url" id="admin-lec-link" placeholder="رابط رسالة التلكرام (الفيديو)" class="w-full mb-3 bg-gray-50 border rounded-lg p-2 text-sm focus:outline-none" dir="ltr">
                            <button onclick="adminAddLecture()" class="w-full bg-green-500 text-white font-bold py-2 rounded-lg text-sm active:bg-green-600 shadow-md">نشر المحاضرة</button>
                        </div>

                        <!-- إنشاء كود -->
                        <div class="bg-gray-800 text-white p-4 rounded-xl shadow-lg mt-6">
                            <h3 class="font-bold mb-3 border-b border-gray-600 pb-2"><i class="fas fa-key ml-2 text-yellow-400"></i> توليد كود اشتراك</h3>
                            <select id="admin-code-teacher" class="w-full mb-3 bg-gray-700 border border-gray-600 rounded-lg p-2 text-sm text-white">
                                ${dbData.teachers.map(t => `<option value="${t.id}">${t.grade} - ${t.name}</option>`).join('')}
                            </select>
                            <button onclick="adminGenerateCode()" class="w-full bg-yellow-500 text-gray-900 font-bold py-3 rounded-lg text-sm active:bg-yellow-600 shadow-lg">إنشاء الكود الآن</button>
                            
                            <!-- مكان عرض الكود الجديد -->
                            <div id="newCodeResult" class="hidden mt-4 p-3 bg-gray-900 border border-dashed border-gray-500 rounded text-center text-xl font-mono tracking-widest text-green-400 select-all cursor-pointer" onclick="document.execCommand('copy'); showToast('تم النسخ')"></div>
                        </div>

                    </div>
                </div>
            `;
            
            const adminContainer = document.createElement('div');
            adminContainer.id = 'adminPanelContainer';
            adminContainer.innerHTML = html;
            document.body.appendChild(adminContainer);
        };

        window.closeAdminPanel = () => {
            const el = document.getElementById('adminPanelContainer');
            if(el) el.remove();
        };

        // وظائف الإضافة في لوحة التحكم
        window.adminAddSubject = async () => {
            const grade = document.getElementById('admin-sub-grade').value;
            const name = document.getElementById('admin-sub-name').value.trim();
            if(!name) return showToast('اكتب اسم المادة', 'error');
            
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'subjects'));
                await setDoc(docRef, { grade, name });
                dbData.subjects.push({ id: docRef.id, grade, name });
                showToast('تمت الإضافة بنجاح');
                closeAdminPanel(); showAdminPanel(); // Refresh
            } catch(e) { showToast('خطأ: ' + e.message, 'error'); }
        };

        window.adminAddTeacher = async () => {
            const subId = document.getElementById('admin-teacher-subject').value;
            const name = document.getElementById('admin-teacher-name').value.trim();
            if(!subId || !name) return showToast('اكمل البيانات', 'error');
            
            const subject = dbData.subjects.find(s => s.id === subId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'teachers'));
                await setDoc(docRef, { grade: subject.grade, subject: subject.id, name });
                dbData.teachers.push({ id: docRef.id, grade: subject.grade, subject: subject.id, name });
                showToast('تمت الإضافة بنجاح');
                closeAdminPanel(); showAdminPanel();
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.adminAddChapter = async () => {
            const teacherId = document.getElementById('admin-chap-teacher').value;
            const name = document.getElementById('admin-chap-name').value.trim();
            if(!teacherId || !name) return showToast('اكمل البيانات', 'error');
            
            const teacher = dbData.teachers.find(t => t.id === teacherId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chapters'));
                await setDoc(docRef, { grade: teacher.grade, subject: teacher.subject, teacher: teacher.id, name });
                dbData.chapters.push({ id: docRef.id, grade: teacher.grade, subject: teacher.subject, teacher: teacher.id, name });
                showToast('تمت الإضافة بنجاح');
                closeAdminPanel(); showAdminPanel();
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.adminAddLecture = async () => {
            const chapterId = document.getElementById('admin-lec-chapter').value;
            const name = document.getElementById('admin-lec-name').value.trim();
            const link = document.getElementById('admin-lec-link').value.trim();
            if(!chapterId || !name || !link) return showToast('اكمل البيانات', 'error');
            
            const chapter = dbData.chapters.find(c => c.id === chapterId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'lectures'));
                const lecData = { 
                    grade: chapter.grade, subject: chapter.subject, 
                    teacher: chapter.teacher, chapter: chapter.id, 
                    name, link 
                };
                await setDoc(docRef, lecData);
                dbData.lectures.push({ id: docRef.id, ...lecData });
                showToast('تم نشر المحاضرة بنجاح');
                document.getElementById('admin-lec-name').value = '';
                document.getElementById('admin-lec-link').value = '';
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.adminGenerateCode = async () => {
            const teacherId = document.getElementById('admin-code-teacher').value;
            if(!teacherId) return;

            // Generate a random code
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            const code = `DARB-${randomStr}`;

            try {
                // Save to 'codes' collection using the code itself as document ID for fast lookup
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', code), {
                    teacher: teacherId,
                    used: false,
                    usedBy: null,
                    createdAt: new Date().toISOString()
                });

                const resultDiv = document.getElementById('newCodeResult');
                resultDiv.textContent = code;
                resultDiv.classList.remove('hidden');
                showToast('تم توليد الكود، اضغط عليه لنسخه');
                
            } catch (error) {
                showToast('حدث خطأ أثناء التوليد', 'error');
            }
        };

    </script>
</body>
</html>
